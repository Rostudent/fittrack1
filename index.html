<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack – Dein Fitness-Tracker</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0e1830; --card:#131f36; --card2:#18263f;
    --text:#e8eefb; --muted:#8ea2c0; --accent:#22d3ee; --accent2:#4ade80;
    --danger:#f87171; --warn:#fbbf24; --purple:#a78bfa; --gold:#fbbf24; --border:#22304d; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 10% -10%, #17274a 0%, var(--bg) 55%) fixed;
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit}
  input,select,textarea{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:11px;font-size:14px;width:100%;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;letter-spacing:.02em}
  .btn{
    background:linear-gradient(135deg,var(--accent),#0ea5b7);color:#04222a;font-weight:800;
    padding:12px 18px;border-radius:12px;font-size:14px;transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.green{background:linear-gradient(135deg,var(--accent2),#16a34a);color:#052e16}
  .btn.purple{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#1e1b4b}
  .btn.gold{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#3b2503}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:600}
  .btn.ghost:hover{color:var(--text);border-color:var(--accent)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn.danger{background:transparent;border:1px solid #7f2b2b;color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ---------- AUTH ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{
    width:100%;max-width:430px;background:linear-gradient(180deg,var(--card),#101a2e);
    border:1px solid var(--border);border-radius:24px;padding:32px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;margin-bottom:6px}
  .brand .dot{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:20px}
  .auth-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .tabs2{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:20px;border:1px solid var(--border)}
  .tabs2 button{flex:1;background:transparent;color:var(--muted);padding:9px;border-radius:9px;font-weight:700;font-size:13px}
  .tabs2 button.active{background:var(--accent);color:#04222a}
  .field{margin-bottom:14px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  .hint{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5;text-align:center}

  /* ---------- APP ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:rgba(11,18,32,.85);border-bottom:1px solid var(--border);
    padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:15px}
  nav.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
  nav.tabs button{background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.15s}
  nav.tabs button:hover{color:var(--text);background:var(--card2)}
  nav.tabs button.active{background:var(--card2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--border)}
  .user-box{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--accent));display:grid;place-items:center;color:#0b1220;font-weight:900;font-size:13px}
  .lang-select{width:auto;padding:7px 10px;font-size:13px;font-weight:700;border-radius:10px}
  .datebar{display:flex;align-items:center;gap:12px;padding:14px 20px 0;max-width:1240px;margin:0 auto;width:100%;flex-wrap:wrap}
  .datebar .dlabel{font-size:15px;font-weight:800;text-transform:capitalize}
  .datebar input{width:auto}


  /* ---- Uhr ---- */
  .clock{background:#000;border:1px solid #2a3a5c;border-radius:11px;padding:6px 14px;text-align:right;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.55)}
  .clock .time{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:800;letter-spacing:.08em;color:#f4f8ff;font-variant-numeric:tabular-nums;line-height:1.15}
  .clock .sec{color:var(--accent)}
  .clock .dt{font-size:10px;font-weight:700;letter-spacing:.05em;color:#93a6c4;margin-top:1px}

  main{max-width:1240px;margin:0 auto;padding:18px 20px 40px;width:100%}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .grid{display:grid;gap:16px}
  .g5{grid-template-columns:repeat(5,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
  @media(max-width:700px){.g5{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g4{grid-template-columns:1fr}.g5{grid-template-columns:1fr}}

  .card{background:linear-gradient(180deg,var(--card),#101a2e);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .card h3{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:14px;letter-spacing:.02em}
  .stat .big{font-size:30px;font-weight:900;letter-spacing:-.02em}
  .stat .unit{font-size:14px;color:var(--muted);font-weight:700}
  .stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stat .icon{font-size:18px;margin-bottom:8px;display:block}

  .bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px;border:1px solid var(--border)}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
  .bar.c > i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .bar.w > i{background:linear-gradient(90deg,#38bdf8,#2563eb)}
  .bar.s > i{background:linear-gradient(90deg,var(--purple),#7c3aed)}
  .bar.sl > i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .bar.cf > i{background:linear-gradient(90deg,#c084fc,#7c3aed)}
  .bar.danger > i{background:linear-gradient(90deg,#f87171,#dc2626)}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > *{flex:1;min-width:110px}
  .row .fixed{flex:0 0 auto;min-width:0}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:600;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  .list{margin-top:6px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .item .nm{flex:1;font-size:14px;font-weight:600}
  .item .meta{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
  .item .val{font-weight:800;font-size:14px;white-space:nowrap}
  .item .x{background:transparent;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:8px}
  .item .x:hover{color:var(--danger);background:#2a1620}
  .thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;border:1px solid var(--border);flex:0 0 auto;cursor:pointer}

  .macro{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
  .macro div{flex:1;min-width:80px}
  .macro .lbl{font-size:11.5px;color:var(--muted);font-weight:700}
  .macro .v{font-size:16px;font-weight:900;margin:3px 0 6px}
  .macro .bar{margin-top:0;height:6px}

  canvas{width:100%;height:180px;display:block}
  .chart-lg{height:230px}

  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px;font-style:italic}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:13px 22px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:.35s cubic-bezier(.2,.9,.3,1.3);z-index:2000;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .section-title{font-size:20px;font-weight:900;margin-bottom:4px}
  .section-desc{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .divider{height:1px;background:var(--border);margin:18px 0}
  .welcome{background:linear-gradient(135deg,#14304d,#101a2e);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .welcome .t{font-size:20px;font-weight:900}
  .welcome .s{color:var(--muted);font-size:13.5px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:1px solid var(--border)}
  td{padding:9px 6px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  .ok{color:var(--accent2)}.bad{color:var(--danger)}.neu{color:var(--muted)}

  /* ---- KI-Chat (Dashboard rechts) ---- */
  .dash-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  .dash-main{min-width:0}
  @media(max-width:1050px){.dash-layout{grid-template-columns:1fr}}
  .dash-chat{position:sticky;top:86px}
  @media(max-width:1050px){.dash-chat{position:static}}
  .chat-card{display:flex;flex-direction:column}
  .chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px;min-height:200px;max-height:340px}
  .chat-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .chat-msg.bot{background:var(--card2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
  .chat-msg.me{background:linear-gradient(135deg,var(--accent),#0ea5b7);color:#04222a;font-weight:600;align-self:flex-end;border-bottom-right-radius:4px}
  .chat-msg.typing{color:var(--muted);font-style:italic}
  .chat-input{display:flex;gap:8px;margin-top:12px}
  .chat-input input{flex:1;min-width:0}
  .chat-input button{flex:0 0 auto;width:48px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#0ea5b7);color:#04222a;font-size:16px;font-weight:900}
  .chat-suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chat-suggest button{font-size:11.5px;padding:6px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-weight:600;transition:.15s}
  .chat-suggest button:hover{border-color:var(--accent);color:var(--accent)}
  .chat-badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);color:var(--muted);margin-left:6px;vertical-align:middle}

  /* ---- Mini-Spiel: Tic Tac Toe ---- */
  .tt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
  .tt-cell{
    aspect-ratio:1/1;background:var(--card2);border:1px solid var(--border);border-radius:16px;
    font-size:46px;font-weight:900;line-height:1;display:grid;place-items:center;
    transition:.15s;color:var(--text);padding:0;
  }
  .tt-cell:hover:not(:disabled){border-color:var(--accent);background:#1b2a45;transform:translateY(-2px)}
  .tt-cell.x{color:var(--accent)}
  .tt-cell.o{color:var(--purple)}
  .tt-cell.win{background:rgba(74,222,128,.16);border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
  .tt-cell:disabled{cursor:default}
  .tt-status{text-align:center;font-size:17px;font-weight:900;margin-bottom:16px;min-height:26px;color:var(--muted)}
  .tt-status.win{color:var(--accent2)}
  .tt-status.lose{color:var(--danger)}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,8,18,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow:auto}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:430px;background:linear-gradient(180deg,var(--card),#101a2e);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fade .2s ease;margin:auto}
  .modal.wide{max-width:520px}
  .modal h3{font-size:17px;font-weight:900;margin-bottom:8px}
  .modal p{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .btn{flex:1}
  .admin-badge{color:var(--warn);border-color:#7a5b13;font-weight:900}
  .premium-badge{color:#3b2503;background:linear-gradient(135deg,#fcd34d,#f59e0b);border-color:#f59e0b;font-weight:900}

  /* ---- Rang & Leaderboard ---- */
  .rank-mini{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .rank-chip{display:inline-flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:9px 15px;font-weight:900;font-size:14px}
  .rank-chip .ri{font-size:18px;line-height:1}

  /* ---- Premium ---- */
  .premium-hero{text-align:center;padding:6px 0 4px}
  .premium-hero .crown{font-size:38px;line-height:1}
  .price{font-size:38px;font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
  .price small{font-size:14px;color:var(--muted);font-weight:700}
  .perk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--text);padding:7px 0;text-align:left}
  .perk span.i{color:var(--accent2);font-weight:900}
  .paymethods{display:flex;gap:10px;margin:6px 0 4px}
  .paymethods button{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:12px;border-radius:12px;font-weight:700;font-size:13px}
  .paymethods button.active{border-color:var(--gold);color:var(--gold)}
  .lock-note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#f5d78a;margin-bottom:14px;line-height:1.5}

  /* ---- Foto ---- */
  .dropzone{border:2px dashed var(--border);border-radius:16px;padding:26px 16px;text-align:center;transition:.2s;cursor:pointer;background:var(--card2)}
  .dropzone:hover{border-color:var(--accent);background:#1b2a45}
  .dropzone .big{font-size:34px;margin-bottom:8px}
  .dropzone .t{font-weight:800;font-size:14px}
  .dropzone .s{color:var(--muted);font-size:12.5px;margin-top:5px}
  .preview{width:100%;border-radius:14px;border:1px solid var(--border);display:block;max-height:280px;object-fit:cover}
  .analyze-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-top:12px;line-height:1.55}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- Social ---- */
  .footer-social{max-width:1240px;margin:0 auto;padding:30px 20px 46px;text-align:center;border-top:1px solid var(--border)}
  .footer-social h4{font-size:15px;font-weight:900;margin-bottom:6px}
  .footer-social .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .social-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .social-link{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:13px;font-weight:800;font-size:13.5px;transition:.18s}
  .social-link:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .social-link svg{width:19px;height:19px;flex:0 0 auto}
  .social-link .handle{color:var(--muted);font-weight:600;font-size:12.5px}
  .social-link.ig:hover{border-color:#e1306c;color:#e1306c}
  .social-link.ig:hover .handle{color:#e1306c;opacity:.85}
  .social-mini{display:flex;justify-content:center;margin-top:18px}
</style>
</head>
<body>


<!-- ================= AUTH ================= -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div style="position:absolute;top:20px;right:20px">
      <select id="langSelectAuth" class="lang-select">
        <option value="de">🇩🇪 DE</option>
        <option value="en">🇬🇧 EN</option>
      </select>
    </div>
    <div class="brand"><span class="dot">💪</span> FitTrack</div>
    <div class="auth-sub" data-i18n="auth.tagline"></div>

    <div class="tabs2">
      <button id="tabLogin" class="active" data-i18n="auth.login"></button>
      <button id="tabRegister" data-i18n="auth.register"></button>
    </div>

    <form id="loginForm">
      <div class="field"><label data-i18n="auth.username"></label><input id="loginUser" autocomplete="username" placeholder="z. B. julian"></div>
      <div class="field"><label data-i18n="auth.password"></label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn" style="width:100%" type="submit" data-i18n="auth.loginBtn"></button>
      <div class="err" id="loginErr"></div>
    </form>

    <form id="registerForm" class="hidden">
      <div class="field"><label data-i18n="auth.username"></label><input id="regUser" autocomplete="username" placeholder="z. B. julian"></div>
      <div class="field"><label data-i18n="auth.name"></label><input id="regName" placeholder="z. B. Julian"></div>
      <div class="field"><label data-i18n="auth.password"></label><input id="regPass" type="password" autocomplete="new-password" placeholder="min. 4"></div>
      <div class="field"><label data-i18n="auth.pass2"></label><input id="regPass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
      <button class="btn green" style="width:100%" type="submit" data-i18n="auth.registerBtn"></button>
      <div class="err" id="regErr"></div>
    </form>

    <p class="hint" data-i18n="auth.hint"></p>

    <button class="btn ghost" id="fastLoginBtn" style="width:100%;margin-top:18px">
      <span data-i18n="auth.fastlogin"></span> <span style="opacity:.6" data-i18n="auth.adminOnly"></span>
    </button>

    <div class="social-mini">
      <a class="social-link ig" href="https://www.instagram.com/ijxlixni" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        <span>Instagram</span><span class="handle">@ijxlixni</span>
      </a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo"><span class="dot">💪</span> FitTrack</div>
    <nav class="tabs" id="navTabs">

   --------------------------------------------------------- */
const MEM = {};
const store = {
  get(k){
    try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){}
    return (k in MEM) ? MEM[k] : null;
  },
  set(k,v){
    MEM[k] = String(v);
    try{ localStorage.setItem(k, v); }catch(e){}
  },
  del(k){
    delete MEM[k];
    try{ localStorage.removeItem(k); }catch(e){}
  }
};

      'border-radius:12px;font:13px/1.5 system-ui,sans-serif;white-space:pre-wrap';
    document.body.appendChild(b);
  }
  b.textContent = '⚠️ Fehler: ' + (ev.message || 'unbekannt') +

});

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || (I18N.de[key]) || key;
  if(vars){ Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); }); }
  return s;
}
function locale(){ return LANG==='de' ? 'de-DE' : 'en-US'; }

function applyLang(){
  document.documentElement.lang = LANG;
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = t(el.dataset.i18n); });

/* =========================================================
   Helpers
   ========================================================= */
function $(id){ return document.getElementById(id); }
function todayKey(){ return dateKey(new Date()); }
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function addDays(key, n){ const d=new Date(key+'T00:00:00'); d.setDate(d.getDate()+n); return dateKey(d); }
function fmtDate(key){ return new Date(key+'T00:00:00').toLocaleDateString(locale(),{weekday:'long',day:'numeric',month:'long'}); }
function fmtShort(key){ return new Date(key+'T00:00:00').toLocaleDateString(locale(),{day:'2-digit',month:'2-digit'}); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)^s.charCodeAt(i); } return (h>>>0).toString(16); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtN(n){ return Math.round(n).toLocaleString(locale()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._tm); el._tm=setTimeout(()=>el.classList.remove('show'),2600);
}

/* =========================================================
   Storage
   ========================================================= */
function loadUsers(){
  try{ return JSON.parse(store.get(LS_USERS) || '{}'); }catch(e){ return {}; }
}
function saveUsers(u){ store.set(LS_USERS, JSON.stringify(u)); }

function defaultData(name){
  return {
    profile:{
      name:name||'', age:30, height:175, weight:75, gender:'m', activity:1.375,
      goal:'maintain', goalWeight:75, startWeight:75,
      goalCalories:2200, goalSteps:10000, goalWater:2000, goalSleep:8, goalCaffeine:400,
      premium:false, premiumSince:null, apiKey:''
    },
    days:{}
  };
}
function save(){
  try{ store.set(LS_DATA(currentUser), JSON.stringify(DATA)); }
  catch(e){ toast(t('err.storage')); }
  scheduleCloudPush();
}
function getDay(key, create){
  if(!DATA.days[key]){
    const blank={ meals:[], steps:0, water:0, sleep:0, caffeineLog:[], workouts:[], weight:null };
    if(create){ DATA.days[key]=blank; } else { return blank; }
  }
  const d=DATA.days[key];
  if(!d.meals) d.meals=[];
  if(!d.workouts) d.workouts=[];
  if(!d.caffeineLog) d.caffeineLog=[];
  /* Migration aus älteren Versionen */
  d.meals.forEach(m=>{ m.type = normMealType(m.type); });
  if(d.caffeine && !d.caffeineLog.length){ d.caffeineLog.push({ id:'legacy-'+key, name:'Caffeine', mg:num(d.caffeine), time:'' }); }
  return d;
}
const LEGACY_MEAL_TYPES = {
  'Frühstück':'meal.breakfast','Mittagessen':'meal.lunch','Abendessen':'meal.dinner','Snack':'meal.snack',
  'Breakfast':'meal.breakfast','Lunch':'meal.lunch','Dinner':'meal.dinner'
};
function normMealType(x){
  if(MEAL_TYPES.indexOf(x)!==-1) return x;
  return LEGACY_MEAL_TYPES[x] || 'meal.snack';
}
function mealTotals(d){
  return d.meals.reduce((a,m)=>({ kcal:a.kcal+num(m.kcal), p:a.p+num(m.protein), c:a.c+num(m.carbs), f:a.f+num(m.fat) }),{kcal:0,p:0,c:0,f:0});
}
function workoutTotals(d){
  return d.workouts.reduce((a,w)=>({ kcal:a.kcal+num(w.kcal), min:a.min+num(w.dur), n:a.n+1 }),{kcal:0,min:0,n:0});
}
function caffeineTotal(d){ return (d.caffeineLog||[]).reduce((a,c)=>a+num(c.mg),0); }
function lastNDays(n, endKey){
  const end=endKey||selectedDate; const out=[];
  for(let i=n-1;i>=0;i--) out.push(addDays(end,-i));
  return out;
}
function isPremium(){ return !!(DATA && DATA.profile && DATA.profile.premium); }

$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
  $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden');
};
$('tabRegister').onclick = () => {
  $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
  $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden');
};

$('registerForm').onsubmit = e => {
  e.preventDefault();
  const u=$('regUser').value.trim().toLowerCase();
  const name=$('regName').value.trim();
  const p=$('regPass').value, p2=$('regPass2').value;
  const err=$('regErr');
  if(u.length<3) return err.textContent=t('auth.err.userShort');
  if(!/^[a-z0-9_.-]+$/.test(u)) return err.textContent=t('auth.err.userChars');
  if(p.length<4) return err.textContent=t('auth.err.passShort');
  if(p!==p2) return err.textContent=t('auth.err.passMatch');
  const users=loadUsers();
  if(users[u]) return err.textContent=t('auth.err.userTaken');
  users[u]={ pass:hash(p), name:name||u, created:Date.now() };
  saveUsers(users);
  err.textContent='';
  store.set(LS_DATA(u), JSON.stringify(defaultData(name||u)));
  store.set(LS_SESSION, u);
  enterApp(u);
};

$('loginForm').onsubmit = e => {
  e.preventDefault();
  const u=$('loginUser').value.trim().toLowerCase();
  const p=$('loginPass').value;
  const err=$('loginErr');
  const users=loadUsers();
  if(!users[u]) return err.textContent=t('auth.err.noUser');
  if(users[u].pass !== hash(p)) return err.textContent=t('auth.err.wrongPass');
  err.textContent='';
  store.set(LS_SESSION, u);
  enterApp(u);
};

$('logoutBtn').onclick = () => {
  store.del(LS_SESSION);
  currentUser=null; DATA=null;
  $('app').classList.add('hidden');
  $('authScreen').classList.remove('hidden');
  $('loginPass').value='';
};

/* ---------- Admin Fast Login ---------- */
function doFastLogin(){
  const err=$('adminErr');
  if($('adminPass').value !== ADMIN_PASS){ err.textContent=t('admin.wrong'); return; }
  err.textContent='';
  const users=loadUsers();
  if(!users[ADMIN_USER]){
    users[ADMIN_USER]={ pass:hash('admin-'+uid()), name:'Admin', created:Date.now() };
    saveUsers(users);
    const d=defaultData('Admin'); d.profile.premium=true; d.profile.premiumSince=Date.now();
    store.set(LS_DATA(ADMIN_USER), JSON.stringify(d));
  }
  store.set(LS_SESSION, ADMIN_USER);
  $('adminModal').classList.remove('show');
  $('adminPass').value='';
  enterApp(ADMIN_USER);
  toast(t('admin.ok'));
}
$('fastLoginBtn').onclick = () => {
  $('adminErr').textContent=''; $('adminPass').value='';
  $('adminModal').classList.add('show');
  setTimeout(()=>$('adminPass').focus(),60);
};
$('adminCancel').onclick = () => {
  $('adminModal').classList.remove('show'); $('adminPass').value=''; $('adminErr').textContent='';
};
$('adminOk').onclick = doFastLogin;
$('adminPass').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); doFastLogin(); } });
$('adminModal').addEventListener('click', e => { if(e.target === $('adminModal')) $('adminCancel').click(); });

function enterApp(username){
  currentUser=username;
  try{ DATA = JSON.parse(store.get(LS_DATA(username))); }catch(e){ DATA=null; }
  if(!DATA || !DATA.profile) DATA = defaultData((loadUsers()[username]||{}).name || username);
  if(!DATA.days) DATA.days={};
  const p=DATA.profile;
  if(p.goalCaffeine==null) p.goalCaffeine=400;
  if(p.premium==null) p.premium=false;
  if(p.apiKey==null) p.apiKey='';
  if(!p.startWeight) p.startWeight = p.weight || 75;

  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');

  const nm = p.name || (loadUsers()[username]||{}).name || username;
  $('userLabel').textContent = nm;
  $('avatar').textContent = (nm[0]||'?').toUpperCase();
  $('adminBadge').classList.toggle('hidden', username !== ADMIN_USER);

  selectedDate = todayKey();
  $('datePicker').value = selectedDate;
  render();
  cloudInit();
}

function calcBMR(){
  const p=DATA.profile;
  const base = 10*p.weight + 6.25*p.height - 5*p.age + (p.gender==='m'?5:-161);
  const tdee = base*(p.activity||1.375);
  let target = tdee;
  if(p.goal==='lose') target = tdee-500;
  if(p.goal==='gain') target = tdee+350;
  return { bmr:Math.round(base), tdee:Math.round(tdee), target:Math.round(target) };
}

function shrinkImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

async function analyzeWithGemini(dataUrl, apiKey){
  const base64 = dataUrl.split(',')[1];
  const prompt = 'You are a nutrition expert. Analyse the food in this photo. ' +
    'Reply with ONLY a JSON object, no markdown, using this exact shape: ' +
    '{"name":"short food name","kcal":number,"protein":number,"carbs":number,"fat":number}. ' +
    'kcal = total calories of the visible portion. Use the language "' + (LANG==='de'?'German':'English') + '" for the name.';
  const body = {
    contents:[{ parts:[ {text:prompt}, {inline_data:{ mime_type:'image/jpeg', data:base64 }} ] }],
    generationConfig:{ temperature:0.2, maxOutputTokens:300 }
  };
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(apiKey), {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error('HTTP '+res.status+(txt? ' – '+txt.slice(0,120):''));
  }
  const json = await res.json();
  const cand = json.candidates && json.candidates[0];
  const parts = cand && cand.content && cand.content.parts;
  let text = parts ? parts.map(p=>p.text||'').join('') : '';
  text = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error(t('photo.aiNoJson'));
  const parsed = JSON.parse(m[0]);
  return parsed;
}

/* =========================================================
   Charts
   ========================================================= */
function prepCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  const w=Math.max(rect.width,120), h=Math.max(rect.height,100);
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBars(cv, labels, values, color, goal){
  if(!cv) return;
  const {ctx,w,h}=prepCanvas(cv);
  const pad={l:40,r:10,t:14,b:24};
  const max=Math.max(...values, goal||0, 1)*1.18;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  ctx.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const y=pad.t+ih*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath();
    ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle='#8ea2c0'; ctx.textAlign='right';
    ctx.fillText(String(Math.round(max*(1-i/4))), pad.l-6, y+3);
  }
  const n=values.length, step=iw/n, bw=Math.min(step*0.55,46);
  values.forEach((v,i)=>{
    const x=pad.l+step*i+(step-bw)/2;
    const bh=ih*((v||0)/max);
    const y=pad.t+ih-Math.max(bh,1.5);
    const g=ctx.createLinearGradient(0,y,0,pad.t+ih);
    g.addColorStop(0,color); g.addColorStop(1,color+'44');
    ctx.fillStyle=g; roundRect(ctx,x,y,bw,Math.max(bh,1.5),5); ctx.fill();
    ctx.fillStyle='#8ea2c0'; ctx.textAlign='center';
    ctx.fillText(labels[i], pad.l+step*i+step/2, h-7);
  });
  if(goal){
    const y=pad.t+ih*(1-goal/max);
    ctx.strokeStyle='rgba(251,191,36,.7)'; ctx.setLineDash([5,4]); ctx.beginPath();
    ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.textAlign='left';
}
function drawLine(cv, labels, values, color, goal){
  if(!cv) return;
  const {ctx,w,h}=prepCanvas(cv);
  const pad={l:44,r:12,t:14,b:24};
  const clean=values.filter(v=>v!=null && !isNaN(v));
  if(clean.length===0){
    ctx.fillStyle='#8ea2c0'; ctx.font='12px system-ui'; ctx.textAlign='center';
    ctx.fillText(LANG==='de'?'Noch keine Daten':'No data yet', w/2, h/2); ctx.textAlign='left'; return;
  }
  let min=Math.min(...clean), max=Math.max(...clean);
  if(goal){ min=Math.min(min,goal); max=Math.max(max,goal); }
  if(max-min<1){ min-=1; max+=1; }
  const padV=(max-min)*0.15; min-=padV; max+=padV;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+iw*(values.length<=1?0.5:i/(values.length-1));
  const Y=v=>pad.t+ih*(1-(v-min)/(max-min));
  ctx.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const y=pad.t+ih*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath();
    ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle='#8ea2c0'; ctx.textAlign='right';
    ctx.fillText((max-(max-min)*i/4).toFixed(1), pad.l-6, y+3);
  }
  if(goal){
    ctx.strokeStyle='rgba(251,191,36,.65)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,Y(goal)); ctx.lineTo(w-pad.r,Y(goal)); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.beginPath();
  let started=false;
  values.forEach((v,i)=>{ if(v==null||isNaN(v))return; if(!started){ ctx.moveTo(X(i),Y(v)); started=true; } else ctx.lineTo(X(i),Y(v)); });
  ctx.stroke();
  const pts=values.map((v,i)=>({v,i})).filter(p=>p.v!=null&&!isNaN(p.v));
  if(pts.length>1){
    const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ih);
    g.addColorStop(0,color+'44'); g.addColorStop(1,color+'00');
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(X(pts[0].i),pad.t+ih);
    pts.forEach(p=>ctx.lineTo(X(p.i),Y(p.v)));
    ctx.lineTo(X(pts[pts.length-1].i),pad.t+ih);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle=color;
  values.forEach((v,i)=>{ if(v==null||isNaN(v))return; ctx.beginPath(); ctx.arc(X(i),Y(v),3.2,0,7); ctx.fill(); });
  ctx.fillStyle='#8ea2c0'; ctx.textAlign='center';
  values.forEach((v,i)=>{ if(values.length>10 && i%2!==0) return; ctx.fillText(labels[i], X(i), h-7); });
  ctx.textAlign='left';
}
function drawDoubleBars(cv, labels, s1, s2, c1, c2, l1, l2){
  if(!cv) return;
  const {ctx,w,h}=prepCanvas(cv);
  const pad={l:40,r:10,t:26,b:24};
  const max=Math.max(...s1,...s2,1)*1.18;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  ctx.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const y=pad.t+ih*i/4;
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath();
    ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle='#8ea2c0'; ctx.textAlign='right';
    ctx.fillText(String(Math.round(max*(1-i/4))), pad.l-6, y+3);
  }
  const n=labels.length, step=iw/n, bw=Math.min(step*0.26,22);
  labels.forEach((lb,i)=>{
    const cx=pad.l+step*i+step/2;
    const h1=ih*(s1[i]/max), h2=ih*(s2[i]/max);
    ctx.fillStyle=c1+'cc'; roundRect(ctx,cx-bw-2,pad.t+ih-h1,bw,Math.max(h1,1.5),4); ctx.fill();
    ctx.fillStyle=c2+'cc'; roundRect(ctx,cx+2,pad.t+ih-h2,bw,Math.max(h2,1.5),4); ctx.fill();
    ctx.fillStyle='#8ea2c0'; ctx.textAlign='center'; ctx.fillText(lb,cx,h-7);
  });
  ctx.textAlign='left'; ctx.fillStyle=c1; ctx.fillRect(pad.l,6,10,10);
  ctx.fillStyle='#8ea2c0'; ctx.fillText(l1, pad.l+15, 15);
  ctx.fillStyle=c2; ctx.fillRect(pad.l+120,6,10,10);
  ctx.fillStyle='#8ea2c0'; ctx.fillText(l2, pad.l+135, 15);
}

function computeStreakFor(data){
  let s=0, k=todayKey();
  for(let i=0;i<400;i++){
    const d=data && data.days ? data.days[k] : null;
    const active = d && ((d.meals||[]).length>0 || (d.steps||0)>0 || (d.water||0)>0 ||
      (d.workouts||[]).length>0 || (d.sleep||0)>0 || caffeineTotal(d)>0);
    if(active) s++; else if(i>0) break;
    k=addDays(k,-1);
  }
  return s;
}
function computeStreak(){ return computeStreakFor(DATA); }

async function sbFetch(path, opts){
  const o = opts || {};
  const headers = Object.assign({ 'apikey': CLOUD.key, 'Content-Type':'application/json' }, o.headers||{});
  if(!o.noAuth && CLOUD.session && CLOUD.session.access_token){
    headers['Authorization'] = 'Bearer '+CLOUD.session.access_token;
  }
  const res = await fetch(CLOUD.url.replace(/\/+$/,'')+path, { method:o.method||'GET', headers:headers, body:o.body });
  const txt = await res.text();
  let body=null; try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body=txt; }
  if(!res.ok){
    const msg = (body && (body.error_description || body.msg || body.message || body.hint)) || ('HTTP '+res.status);
    throw new Error(msg);
  }
  return body;
}
function setCloudSession(r){
  CLOUD.session = {
    access_token: r.access_token,
    refresh_token: r.refresh_token,
    expires_at: Date.now() + ((r.expires_in||3600)-60)*1000,
    user_id: (r.user && r.user.id) || (CLOUD.session && CLOUD.session.user_id) || null,
    email: (r.user && r.user.email) || (CLOUD.session && CLOUD.session.email) || ''
  };
  saveCloudSess(CLOUD.session);
}
async function cloudEnsureToken(){
  if(!CLOUD.session) return false;
  if(CLOUD.session.expires_at && Date.now() < CLOUD.session.expires_at) return true;
  if(!CLOUD.session.refresh_token) return false;
  try{
    const r = await sbFetch('/auth/v1/token?grant_type=refresh_token', {
      method:'POST', noAuth:true, body: JSON.stringify({ refresh_token: CLOUD.session.refresh_token })
    });
    setCloudSession(r);
    return true;
  }catch(e){ return false; }
}
async function cloudConnect(email, password){
  let r=null;
  try{
    r = await sbFetch('/auth/v1/token?grant_type=password', {
      method:'POST', noAuth:true, body: JSON.stringify({ email:email, password:password })
    });
  }catch(e1){
    try{
      r = await sbFetch('/auth/v1/signup', {
        method:'POST', noAuth:true, body: JSON.stringify({ email:email, password:password })
      });
    }catch(e2){
      throw new Error(e2.message || e1.message);
    }
    if(!r || !r.access_token) throw new Error(t('cloud.needConfirm'));
  }
  setCloudSession(r);
  return r;
}
async function cloudPush(silent){
  if(!cloudOn() || !DATA || CLOUD.busy) return false;
  CLOUD.busy = true;
  try{
    if(!await cloudEnsureToken()) throw new Error(t('cloud.expired'));
    await sbFetch('/rest/v1/fittrack_data', {
      method:'POST',
      headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ user_id: CLOUD.session.user_id, data: DATA, updated_at: new Date().toISOString() }])
    });
    CLOUD.lastSync = Date.now();
    updateCloudStatus();
    if(!silent) toast(t('cloud.pushed'));
    return true;
  }catch(e){
    if(!silent) toast(t('cloud.err',{e:e.message}));
    return false;
  }finally{ CLOUD.busy=false; }
}
async function cloudPull(silent){
  if(!cloudOn()) return false;
  try{
    if(!await cloudEnsureToken()) throw new Error(t('cloud.expired'));
    const uid = CLOUD.session.user_id;
    const rows = await sbFetch('/rest/v1/fittrack_data?user_id=eq.'+encodeURIComponent(uid)+'&select=data,updated_at');
    if(Array.isArray(rows) && rows.length && rows[0].data && rows[0].data.profile){
      suppressCloud = true;
      DATA = rows[0].data;
      if(!DATA.days) DATA.days = {};
      const p = DATA.profile;
      if(p.goalCaffeine==null) p.goalCaffeine=400;
      if(p.premium==null) p.premium=false;
      if(p.apiKey==null) p.apiKey='';
      if(!p.startWeight) p.startWeight = p.weight||75;
      save();
      suppressCloud = false;
      if(p.name){ $('userLabel').textContent=p.name; $('avatar').textContent=(p.name[0]||'?').toUpperCase(); }
      render();
      CLOUD.lastSync = Date.now();
      updateCloudStatus();
      if(!silent) toast(t('cloud.pulled'));
      return true;
    }
    await cloudPush(true);
    if(!silent) toast(t('cloud.pushedFirst'));
    return true;
  }catch(e){
    suppressCloud = false;
    if(!silent) toast(t('cloud.err',{e:e.message}));
    return false;
  }
}
function scheduleCloudPush(){
  if(!cloudOn() || suppressCloud) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(function(){ cloudPush(true); }, 2500);
}
function updateCloudStatus(){

const RANKS = [
  {min:0,   de:'Couch Potato',    en:'Couch Potato',   icon:'🛋️', color:'#64748b'},
  {min:1,   de:'Amateur',         en:'Amateur',        icon:'🌱', color:'#84cc16'},
  {min:3,   de:'Einsteiger',      en:'Beginner',       icon:'🚶', color:'#4ade80'},
  {min:7,   de:'Dranbleiber',     en:'Consistent',     icon:'🔥', color:'#22d3ee'},
  {min:14,  de:'Fortgeschritten', en:'Advanced',       icon:'💪', color:'#38bdf8'},
  {min:30,  de:'Athlet',          en:'Athlete',        icon:'🏃', color:'#a78bfa'},
  {min:60,  de:'Fitness-Freak',   en:'Fitness Freak',  icon:'⚡', color:'#c084fc'},
  {min:100, de:'Eisen-Junkie',    en:'Iron Addict',    icon:'🏋️', color:'#f472b6'},
  {min:150, de:'Gym-Veteran',     en:'Gym Veteran',    icon:'🥇', color:'#fbbf24'},
  {min:200, de:'Gymbro',          en:'Gymbro',         icon:'🦍', color:'#f59e0b'},
  {min:365, de:'Legende',         en:'Legend',         icon:'👑', color:'#fcd34d'}
];
function rankFor(streak){
  let i=0;
  for(let k=0;k<RANKS.length;k++){ if(streak>=RANKS[k].min) i=k; }
  const rank=RANKS[i], next=RANKS[i+1]||null;
  const span = next ? (next.min-rank.min) : 0;
  const done = next ? (streak-rank.min) : 0;
  return {
    index:i, rank, next,
    progress: next ? clamp(done/span*100,0,100) : 100,
    toNext: next ? (next.min-streak) : 0
  };
}
function rankName(r){ return LANG==='de' ? r.de : r.en; }

');\n'+
'alter table public.fittrack_visits enable row level security;\n'+
'\n'+
'create or replace function public.fittrack_visit()\n'+
'returns void language sql security definer set search_path = public as $$\n'+
'  insert into public.fittrack_visits (day, visits) values (current_date, 1)\n'+
'  on conflict (day) do update set visits = public.fittrack_visits.visits + 1;\n'+
'$$;\n'+

'\n'+
'-- Anwesenheit: wer ist gerade online\n'+

'\n'+
'-- Admin-Statistiken (nur fuer die Admin-E-Mail aufrufbar)\n'+
'create or replace function public.fittrack_admin_stats()\n'+
'returns jsonb language plpgsql security definer set search_path = public as $$\n'+
'declare em text;\n'+
'begin\n'+
"  em := coalesce(current_setting('request.jwt.claims', true)::jsonb ->> 'email', '');\n"+
"  if em <> '"+em+"' then raise exception 'not authorized'; end if;\n"+

/* =========================================================
   Mini-Spiel: Tic Tac Toe mit KI (Minimax)
   ========================================================= */
const TT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const TT = { board:['','','','','','','','',''], human:'X', ai:'O', over:false, busy:false, diff:'hard', line:null };

function ttStats(){
  if(!DATA.game || typeof DATA.game !== 'object') DATA.game = { wins:0, losses:0, draws:0 };
  const g = DATA.game;
  if(g.wins==null) g.wins=0;
  if(g.losses==null) g.losses=0;
  if(g.draws==null) g.draws=0;
  return g;
}
function ttWinner(b){
  for(let i=0;i<TT_LINES.length;i++){
    const L = TT_LINES[i];
    if(b[L[0]] && b[L[0]]===b[L[1]] && b[L[0]]===b[L[2]]) return { p:b[L[0]], line:L };
  }
  for(let i=0;i<9;i++){ if(!b[i]) return null; }
  return { p:'draw', line:null };
}
function ttMinimax(b, player, depth){
  const w = ttWinner(b);
  if(w){
    if(w.p==='draw') return { score:0, move:null };
    return { score: (w.p===TT.ai ? 10-depth : depth-10), move:null };
  }
  let best = null;
  for(let i=0;i<9;i++){
    if(b[i]) continue;
    b[i] = player;
    const r = ttMinimax(b, player===TT.ai ? TT.human : TT.ai, depth+1);
    b[i] = '';
    if(!best || (player===TT.ai ? r.score > best.score : r.score < best.score)) best = { score:r.score, move:i };
  }
  return best || { score:0, move:null };
}
function ttAiPick(){
  const empty = [];
  for(let i=0;i<9;i++){ if(!TT.board[i]) empty.push(i); }
  if(!empty.length) return null;
  const rnd = TT.diff==='easy' ? 0.75 : (TT.diff==='medium' ? 0.3 : 0);
  if(Math.random() < rnd) return empty[Math.floor(Math.random()*empty.length)];
  const r = ttMinimax(TT.board.slice(), TT.ai, 0);
  return (r && r.move!=null) ? r.move : empty[0];
}
function ttNewRound(){
  TT.board = ['','','','','','','','',''];
  TT.over = false; TT.busy = false; TT.line = null;
  renderTT();
}
function ttFinish(w){
  TT.over = true; TT.busy = false; TT.line = w.line || null;
  const g = ttStats();
  if(w.p==='draw') g.draws++;
  else if(w.p===TT.human) g.wins++;
  else g.losses++;
  save();
  renderTT();
}
function ttPlay(i){
  if(TT.over || TT.busy || TT.board[i]) return;
  TT.board[i] = TT.human;
  const w = ttWinner(TT.board);
  if(w){ ttFinish(w); return; }
  TT.busy = true;
  renderTT();
  setTimeout(function(){
    const m = ttAiPick();
    if(m!=null) TT.board[m] = TT.ai;
    TT.busy = false;
    const w2 = ttWinner(TT.board);
    if(w2) ttFinish(w2); else renderTT();
  }, 420);
}
function renderTT(){
  const grid = $('ttBoard');
  if(!grid) return;
  const g = ttStats();
  $('ttWins').textContent = g.wins;
  $('ttDraws').textContent = g.draws;
  $('ttLosses').textContent = g.losses;

  const w = ttWinner(TT.board);
  let st = t('game.yourTurn'), cls = '';
  if(TT.over && w){
    if(w.p==='draw'){ st = t('game.draw'); }
    else if(w.p===TT.human){ st = t('game.youWin'); cls = 'win'; }
    else { st = t('game.aiWins'); cls = 'lose'; }
  } else if(TT.busy){ st = t('game.aiThinking'); }
  const stEl = $('ttStatus');
  stEl.textContent = st;
  stEl.className = 'tt-status' + (cls ? ' '+cls : '');

  grid.innerHTML = '';
  TT.board.forEach(function(v,i){
    const b = document.createElement('button');
    let c = 'tt-cell';
    if(v) c += (v==='X' ? ' x' : ' o');
    if(TT.line && TT.line.indexOf(i)!==-1) c += ' win';
    b.className = c;
    b.textContent = v || '';
    b.disabled = TT.over || TT.busy || !!v;
    b.onclick = function(){ ttPlay(i); };
    grid.appendChild(b);
  });
}

async function chatGemini(text){
  const key = DATA.profile.apiKey;
  const convo = chatMessages().slice(-8).map(function(m){
    return (m.role==='me' ? 'Nutzer: ' : 'Coach: ') + m.text;
  }).join('\n');
  const prompt = coachContext() + '\n\nBisheriger Chat:\n' + convo +
    '\n\nAntworte als persönlicher Fitness- und Ernährungscoach auf die letzte Nachricht des Nutzers. ' +
    'Maximal 4 Sätze, freundlich und konkret, mit konkreten Zahlen aus den Daten. Sprache: ' +
    (LANG==='de' ? 'Deutsch' : 'Englisch') + '.';
  const body = { contents:[{ parts:[{ text: prompt }] }], generationConfig:{ temperature:0.7, maxOutputTokens:400 } };
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(key), {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body)
  });
  if(!res.ok){
    let tx=''; try{ tx = await res.text(); }catch(e){}
    throw new Error('HTTP '+res.status+(tx ? ' – '+tx.slice(0,140) : ''));
  }
  const j = await res.json();
  const cand = j.candidates && j.candidates[0];
  const parts = cand && cand.content && cand.content.parts;
  const out = parts ? parts.map(function(x){ return x.text||''; }).join('').trim() : '';
  if(!out) throw new Error(t('chat.empty'));
  return out;
}

async function sendChat(){
  const inp = $('chatInput'); if(!inp) return;
  const text = inp.value.trim();
  if(!text || chatBusy) return;
  inp.value = '';
  chatPush('me', text);

  let reply = '';

  const left=p.goalCalories-mt.kcal+wt.kcal;
  $('nGoal').textContent=p.goalCalories;
  $('nIn').textContent=Math.round(mt.kcal);
  $('nOut').textContent=Math.round(wt.kcal);
  $('nLeft').textContent=Math.round(left);
  $('nLeft').style.color = left<0 ? 'var(--danger)':'var(--accent2)';
  $('nutMacros').innerHTML = macroHTML(mt,p);
  renderMealList(d);

  /* Activity */
  $('actSteps').textContent = fmtN(d.steps||0);
  const pct = clamp((d.steps||0)/p.goalSteps*100,0,999);
  $('actStepsSub').textContent = t('act.pctGoal',{n:pct.toFixed(0), g:fmtN(p.goalSteps)});
  $('actStepsBar').style.width = clamp(pct,0,100)+'%';
  const km = (d.steps||0)*0.00075*(p.height/175);
  $('actKm').textContent = t('act.distance',{km:km.toFixed(2), k:Math.round((d.steps||0)*0.04)});
  renderActTable();

  /* Wellness */
  $('wWater').textContent = fmtN(d.water||0);
  $('wWaterSub').textContent = clamp((d.water||0)/p.goalWater*100,0,999).toFixed(0)+'% '+t('c.of')+' '+fmtN(p.goalWater)+' ml';
  $('wWaterBar').style.width = clamp((d.water||0)/p.goalWater*100,0,100)+'%';
  $('wSleep').textContent = (d.sleep||0);
  $('wSleepSub').textContent = clamp((d.sleep||0)/p.goalSleep*100,0,999).toFixed(0)+'% '+t('c.of')+' '+p.goalSleep+' h';
  $('wSleepBar').style.width = clamp((d.sleep||0)/p.goalSleep*100,0,100)+'%';
  $('wCaffeine').textContent = fmtN(cf);
  const cfPct = clamp(cf/p.goalCaffeine*100,0,999);
  $('wCaffeineSub').textContent = cf>p.goalCaffeine
    ? t('well.caffeineWarn',{n:fmtN(cf-p.goalCaffeine)})
    : clamp(cfPct,0,100).toFixed(0)+'% '+t('c.of')+' '+fmtN(p.goalCaffeine)+' mg';
  $('wCaffeineBar').style.width = clamp(cfPct,0,100)+'%';
  $('wCaffeineBar').parentElement.classList.toggle('danger', cf>p.goalCaffeine);
  renderCaffeineList(d);

  /* Training */
  const week=lastNDays(7);
  const weekCount = week.reduce((a,k)=>a+((DATA.days[k]&&DATA.days[k].workouts)?DATA.days[k].workouts.length:0),0);
  $('tCount').textContent = d.workouts.length;
  $('tMin').textContent = Math.round(wt.min);
  $('tKcal').textContent = Math.round(wt.kcal);
  $('tWeek').textContent = weekCount;
  renderWorkoutList(d);

  /* Progress */
  const w7=lastNDays(7);
  const avg=arr=>{ const v=arr.filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : 0; };
  const kcal7=w7.map(k=>{ const dd=DATA.days[k]; return dd?mealTotals(dd).kcal:0; });
  const steps7=w7.map(k=>(DATA.days[k]&&DATA.days[k].steps)||0);
  const water7=w7.map(k=>(DATA.days[k]&&DATA.days[k].water)||0);
  const sleep7=w7.map(k=>(DATA.days[k]&&DATA.days[k].sleep)||0);
  const caff7=w7.map(k=>{ const dd=DATA.days[k]; return dd?caffeineTotal(dd):0; });
  $('pKcal').textContent=Math.round(avg(kcal7));
  $('pSteps').textContent=fmtN(avg(steps7));
  $('pWater').textContent=fmtN(avg(water7));
  $('pCaffeine').textContent=fmtN(avg(caff7));
  $('pSleep').textContent=avg(sleep7).toFixed(1);

  const weights=lastNDays(30).map(k=>{ const dd=DATA.days[k]; return dd&&dd.weight!=null?dd.weight:null; });
  const known=weights.filter(v=>v!=null);
  const curW=known.length?known[known.length-1]:p.weight;
  $('pWeight').textContent = curW?curW.toFixed(1):'–';
  const start=p.startWeight||curW;
  const delta=curW-start;
  const dEl=$('pWeightDelta');
  dEl.textContent = t('pr.sinceStart',{d:(delta>0?'+':'')+delta.toFixed(1)});
  dEl.style.color = (p.goal==='lose' ? (delta<0?'var(--accent2)':'var(--danger)') : (p.goal==='gain'? (delta>0?'var(--accent2)':'var(--danger)') : 'var(--muted)'));
  renderProgressTable();

  /* Settings */
  $('sName').value=p.name||'';
  $('sAge').value=p.age; $('sHeight').value=p.height; $('sWeight').value=p.weight;
  $('sGender').value=p.gender; $('sActivity').value=String(p.activity); $('sGoal').value=p.goal;
  $('sGoalWeight').value=p.goalWeight;
  $('sGoalKcal').value=p.goalCalories; $('sGoalSteps').value=p.goalSteps;
  $('sGoalWater').value=p.goalWater; $('sGoalSleep').value=p.goalSleep; $('sGoalCaffeine').value=p.goalCaffeine;
  if(document.activeElement !== $('sApiKey')) $('sApiKey').value = p.apiKey||'';
  const r=calcBMR();
  $('bmrInfo').innerHTML = t('set.bmrInfo',{b:r.bmr,t:r.tdee,g:r.target});

  /* Charts */
  if(activeView==='dashboard') drawBars($('chartDashKcal'), w7.map(fmtShort), kcal7, '#22d3ee', p.goalCalories);
  else if(activeView==='activity') drawBars($('chartSteps'), w7.map(fmtShort), steps7, '#4ade80', p.goalSteps);
  else if(activeView==='wellness'){
    drawDoubleBars($('chartWellness'), w7.map(fmtShort), water7, sleep7.map(x=>x*100), '#38bdf8', '#fbbf24', 'ml', 'h');
    drawBars($('chartCaffeine'), w7.map(fmtShort), caff7, '#a78bfa', p.goalCaffeine);
  }
  else if(activeView==='training'){
    const wk7=w7.map(k=>{ const dd=DATA.days[k]; return dd?workoutTotals(dd).kcal:0; });
    drawBars($('chartWorkout'), w7.map(fmtShort), wk7, '#a78bfa');
  }
  else if(activeView==='progress'){
    const d14=lastNDays(14);
    const kcal14=d14.map(k=>{ const dd=DATA.days[k]; return dd?mealTotals(dd).kcal:0; });
    drawBars($('chartKcal14'), d14.map(fmtShort), kcal14, '#22d3ee', p.goalCalories);
    const w30=lastNDays(30);
    const wv=w30.map(k=>{ const dd=DATA.days[k]; return dd&&dd.weight!=null?dd.weight:null; });
    drawLine($('chartWeight'), w30.map(fmtShort), wv, '#4ade80', p.goalWeight);
  }
  else if(activeView==='game'){ renderTT(); }
  else if(activeView==='admin'){ renderAdminPanel(); }
}

function typeName(v){
  const keys=['trt.strength','trt.cardio','trt.hiit','trt.run','trt.bike','trt.swim','trt.yoga','trt.mobility','trt.other'];
  if(typeof v==='number') return t(keys[v]||'trt.other');
  if(typeof v==='string' && v.indexOf('trt.')===0) return t(v);
  return v || t('trt.other');
}
function macroHTML(mt,p){
  const goals={ p:Math.round(p.weight*1.8), c:Math.round(p.goalCalories*0.45/4), f:Math.round(p.goalCalories*0.3/9) };
  const rows=[
    {label:t('nut.protein'), v:mt.p, g:goals.p, color:'#22d3ee'},
    {label:t('nut.carbs'), v:mt.c, g:goals.c, color:'#4ade80'},
    {label:t('nut.fat'), v:mt.f, g:goals.f, color:'#fbbf24'}
  ];
  return rows.map(r=>{
    const pct=clamp(r.v/r.g*100,0,100);
    return '<div><div class="lbl">'+r.label+'</div><div class="v">'+r.v.toFixed(0)+' / '+r.g+' g</div>'+
      '<div class="bar" style="background:var(--card2)"><i style="width:'+pct+'%;background:'+r.color+'"></i></div></div>';
  }).join('');
}
function renderMealList(d){
  const el=$('mealList');
  if(!d.meals.length){ el.innerHTML='<div class="empty">'+t('nut.noMeals')+'</div>'; return; }
  let html='';
  MEAL_TYPES.forEach(typeKey=>{
    const items=d.meals.filter(m=>m.type===typeKey);
    if(!items.length) return;
    const sum=items.reduce((a,m)=>a+num(m.kcal),0);
    html+='<div style="margin-top:10px"><span class="pill">'+t(typeKey)+' · '+Math.round(sum)+' kcal</span></div>';
    items.forEach(m=>{
      const macros=[];
      if(num(m.protein)) macros.push('P '+num(m.protein).toFixed(0)+'g');
      if(num(m.carbs)) macros.push('C '+num(m.carbs).toFixed(0)+'g');
      if(num(m.fat)) macros.push('F '+num(m.fat).toFixed(0)+'g');
      const thumb = m.photo ? '<img class="thumb" src="'+m.photo+'" data-photo="'+m.photo+'" alt="">' : '';
      html+='<div class="item">'+thumb+'<div class="nm">'+esc(m.name)+
        '<div class="meta">'+(m.time?esc(m.time):'')+(macros.length?' · '+macros.join(' · '):'')+'</div></div>'+
        '<div class="val">'+Math.round(num(m.kcal))+' kcal</div>'+
        '<button class="x" data-del-meal="'+m.id+'">✕</button></div>';
    });
  });
  el.innerHTML=html;
}
function renderCaffeineList(d){
  const el=$('caffeineList');
  if(!d.caffeineLog.length){ el.innerHTML='<div class="empty">'+t('well.noCaffeine')+'</div>'; return; }
  el.innerHTML=d.caffeineLog.map(c=>
    '<div class="item"><div class="nm">'+esc(c.name)+'<div class="meta">'+(c.time?esc(c.time):'')+'</div></div>'+
    '<div class="val">'+Math.round(num(c.mg))+' mg</div>'+
    '<button class="x" data-del-caffeine="'+c.id+'">✕</button></div>'
  ).join('');
}
function renderWorkoutList(d){
  const el=$('workoutList');
  if(!d.workouts.length){ el.innerHTML='<div class="empty">'+t('tr.noWorkouts')+'</div>'; return; }
  el.innerHTML=d.workouts.map(w=>
    '<div class="item"><div class="nm">'+esc(w.name)+
    '<div class="meta">'+esc(typeName(w.type))+' · '+w.dur+' min'+(w.time?' · '+esc(w.time):'')+'</div></div>'+
    '<div class="val">'+Math.round(num(w.kcal))+' kcal</div>'+
    '<button class="x" data-del-workout="'+w.id+'">✕</button></div>'
  ).join('');
}
function renderActTable(){
  const days=lastNDays(7).reverse();
  let html='<table><thead><tr><th>'+t('act.tableDay')+'</th><th>'+t('act.tableSteps')+'</th><th>'+t('act.tableDist')+'</th><th>'+t('act.tableGoal')+'</th></tr></thead><tbody>';
  days.forEach(k=>{
    const dd=DATA.days[k]||{};
    const st=dd.steps||0;
    const km=st*0.00075*(DATA.profile.height/175);
    const pct=clamp(st/DATA.profile.goalSteps*100,0,999);
    const cls=pct>=100?'ok':pct>=60?'neu':'bad';
    html+='<tr><td>'+fmtShort(k)+'</td><td>'+fmtN(st)+'</td><td>'+km.toFixed(2)+' km</td><td class="'+cls+'">'+pct.toFixed(0)+'%</td></tr>';
  });
  $('actTable').innerHTML=html+'</tbody></table>';
}
function renderProgressTable(){
  const days=lastNDays(7).reverse();
  let html='<table><thead><tr><th>'+t('act.tableDay')+'</th><th>'+t('pr.tableKcal')+'</th><th>'+t('act.tableSteps')+'</th><th>'+
    t('pr.tableWater')+'</th><th>'+t('pr.tableCaffeine')+'</th><th>'+t('pr.tableSleep')+'</th><th>'+
    t('pr.tableTraining')+'</th><th>'+t('pr.tableWeight')+'</th></tr></thead><tbody>';
  days.forEach(k=>{
    const dd=DATA.days[k];
    const kcal=dd?Math.round(mealTotals(dd).kcal):0;
    html+='<tr><td>'+fmtShort(k)+'</td><td>'+kcal+'</td><td>'+fmtN((dd&&dd.steps)||0)+'</td>'+
      '<td>'+((dd&&dd.water)||0)+' ml</td><td>'+((dd?caffeineTotal(dd):0))+' mg</td><td>'+((dd&&dd.sleep)||0)+' h</td>'+
      '<td>'+((dd&&dd.workouts)?dd.workouts.length:0)+'</td>'+
      '<td>'+((dd&&dd.weight!=null)?dd.weight.toFixed(1)+' kg':'–')+'</td></tr>';
  });
  $('progressTable').innerHTML=html+'</tbody></table>';
}
